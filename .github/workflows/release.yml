name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate manifest resource
        run: go run github.com/akavel/rsrc@v0.10.2 -manifest GoCast.manifest -o rsrc.syso

      - name: Build (windows/amd64)
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o GoCast.exe .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" GoCast.exe --title "GoCast ${{ github.ref_name }}" --generate-notes
